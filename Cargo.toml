[package]
name = "react-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
# LLM orchestration
rig-core = "0.2.0"
async-stream = "0.3"

# Async & streaming
tokio = { version = "1.38", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Error handling & Utilities
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

[dev-dependencies]
anyhow = "1.0"
async-trait = "0.1"
tracing-subscriber = "0.3"
mockito = "1.4"

[[example]]
name = "test_tools"
path = "examples/test_tools.rs"
